<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mender tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 24px; background: #fff; color: #16192b; }
  h2 { font-size: 15px; margin: 22px 0 6px; }
  ol { margin: 0; }
  .ok { color: #16794a; } .bad { color: #b42318; }
  #summary { font-weight: 700; margin-top: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0d1019; color: #e6e9f3; } .ok { color: #5bcb8f; } .bad { color: #ff8b7e; } }
</style>
</head>
<body>
<h1>Mender tests</h1>
<p>Add <code>?live</code> to the address to also run the tests against the deployed Quotes API (needs the dev server, tools/serve.py).</p>
<div id="results"></div>
<p id="summary">Running…</p>
<script type="module">
  import { suites } from './suites.js';
  const results = document.getElementById('results');
  let passed = 0;
  let failed = 0;
  for (const [name, tests] of suites) {
    const heading = document.createElement('h2');
    heading.textContent = name;
    const list = document.createElement('ol');
    results.append(heading, list);
    for (const [title, test] of tests) {
      const item = document.createElement('li');
      try {
        await test();
        passed += 1;
        item.className = 'ok';
        item.textContent = `PASS ${title}`;
      } catch (error) {
        failed += 1;
        item.className = 'bad';
        item.textContent = `FAIL ${title} — ${error.message}`;
      }
      list.append(item);
    }
  }
  const summary = document.getElementById('summary');
  summary.textContent = `${passed} of ${passed + failed} passed`;
  summary.className = failed ? 'bad' : 'ok';
</script>
</body>
</html>
