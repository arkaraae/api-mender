name: API Mender check

on:
  pull_request:
    paths:
      - 'mender/sandbox/quotes/openapi-v2.json'
      - '.github/actions/mender-check/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: ./.github/actions/mender-check
        with:
          specs: mender/sandbox/quotes/openapi-v2.json
