name: API Mender check

on:
  pull_request:
    paths:
      - 'mender/sandbox/quotes/openapi-v2.json'
      - '.github/actions/mender-check/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/mender-check
        with:
          specs: mender/sandbox/quotes/openapi-v2.json
