name: Monitor managed Quote API

# Retired demo: the Quote API panel was removed from the product, so this no
# longer runs on a schedule. It can still be started by hand.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: managed-quote-api
  cancel-in-progress: false

jobs:
  mend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check the published contract and validate a rules or self-hosted model fix
        id: mend
        env:
          # Self-hosted model gateway (model-service/). No hosted AI provider.
          MENDER_MODEL_ENDPOINT: ${{ secrets.MENDER_MODEL_ENDPOINT }}
          MENDER_MODEL_NAME: ${{ vars.MENDER_MODEL_NAME }}
          MENDER_MODEL_API_KEY: ${{ secrets.MENDER_MODEL_API_KEY }}
          MENDER_TEST_API_URL: ${{ vars.MENDER_TEST_API_URL || 'https://api-mender.aom31905.chatgpt.site' }}
        run: node scripts/managed-api-mender.mjs
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-quote-api-${{ github.run_id }}
          path: artifacts/managed-api/
          if-no-files-found: ignore
      - name: Open a draft repair pull request
        if: steps.mend.outputs.fix_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mend.outputs.version }}
        run: |
          cp artifacts/managed-api/client.mjs examples/quote-api-consumer/src/client.mjs
          MENDER_TEST_API_URL="${{ vars.MENDER_TEST_API_URL || 'https://api-mender.aom31905.chatgpt.site' }}" npm test --prefix examples/quote-api-consumer
          branch="codex/managed-quote-v${VERSION}"
          git checkout -b "$branch"
          git config user.name 'api-mender[bot]'
          git config user.email 'api-mender[bot]@users.noreply.github.com'
          git add examples/quote-api-consumer/src/client.mjs
          git commit -m "Repair Quote API consumer for contract v${VERSION}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" push origin "$branch"
          if ! gh pr create --draft --base main --head "$branch" --title "Repair Quote API consumer for contract v${VERSION}" --body-file artifacts/managed-api/pull-request.md; then
            echo "Validated fix branch pushed: $branch. GitHub did not allow Actions to open a PR; open the branch for review or enable Actions pull request creation in this repository." >> "$GITHUB_STEP_SUMMARY"
          fi
