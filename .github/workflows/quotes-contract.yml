name: API Mender Quotes contract

on:
  push:
    branches: [main]
    paths:
      - testbed/quotes-api/contract.json

permissions:
  contents: write
  pull-requests: write

jobs:
  mend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The write token is not left in .git/config for npm install and the
          # scripts; only the final step uses it, explicitly.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Detect contract break and validate fix
        id: mend
        env:
          MENDER_PREVIOUS_COMMIT: ${{ github.event.before }}
        run: node scripts/testbed-quotes-ci.mjs
      - name: Save Mender evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quotes-mender-${{ github.sha }}
          path: |
            artifacts/quotes-baseline.json
            artifacts/quotes-mender-report.json
            artifacts/quotes-fix.patch
            artifacts/quotes-pr.md
            artifacts/quotes-db/api-watch.sqlite
            testbed/quotes-api/mender-status.json
          if-no-files-found: ignore
      - name: Open a reviewable fix
        if: steps.mend.outputs.fix_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git apply artifacts/quotes-fix.patch
          MENDER_TEST_API_URL="${{ vars.MENDER_TEST_API_URL || 'https://api-mender.aom31905.chatgpt.site' }}" npm test --prefix testbed/quotes-consumer
          branch="codex/quotes-fix-${SOURCE_SHA:0:12}"
          git checkout -b "$branch"
          git config user.name 'api-mender[bot]'
          git config user.email 'api-mender[bot]@users.noreply.github.com'
          git add testbed/quotes-consumer/src/client.mjs testbed/quotes-api/mender-status.json
          git commit -m 'Fix Quotes consumer for accountId contract'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch"
          if ! gh pr create --base main --head "$branch" --title 'Fix Quotes consumer for accountId contract' --body-file artifacts/quotes-pr.md; then
            echo "The validated fix branch was pushed. GitHub Actions could not create a pull request; open one from $branch or enable Actions pull request creation in this repository's settings." >> "$GITHUB_STEP_SUMMARY"
          fi
