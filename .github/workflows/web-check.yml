name: Check Cloudflare web app

on:
  pull_request:
    paths:
      - 'web/**'
      - 'mender/**'
      - '.github/actions/mender-check/**'
      - '.github/workflows/web-check.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'mender/**'
      - '.github/actions/mender-check/**'
      - '.github/workflows/web-check.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy apimender.com
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    concurrency:
      group: apimender-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build for apimender.com
        run: npm run build
        env:
          CLOUDFLARE_ENV: apimender
      - name: Verify build targets the production Worker
        run: |
          node -e 'const c=require("./dist/server/wrangler.json"); if (c.name !== "apimender-site" || c.account_id !== process.env.CLOUDFLARE_ACCOUNT_ID || !c.routes?.some(r => r.pattern === "apimender.com")) process.exit(1)'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy after checks pass
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
