name: Provider contract catalog

# Provider change ingestion. Downloads each catalog provider's official
# contract versions, diffs every operation, and writes the operation index and
# the slices of changed operations to the catalog tables. Public provider data
# only; no tenant data is read. Without the Supabase secrets it runs as a dry
# run and uploads the delta for review.
on:
  schedule:
    # Twice daily: built-in providers plus APIs discovered from scans.
    - cron: '23 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-contracts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'staging' || '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Diff provider contracts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CATALOG_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.CATALOG_SUPABASE_SECRET_KEY }}
          # Reads public provider spec repositories' commit lists (rate limit only).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SUPABASE_SECRET_KEY" ]; then write=--write; else write=; echo "No catalog secret: dry run"; fi
          node scripts/sync-provider-contracts.mjs --out provider-delta.json $write
      - name: Discover and watch APIs found by scans
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CATALOG_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.CATALOG_SUPABASE_SECRET_KEY }}
          NODE_OPTIONS: --max-old-space-size=1024
        run: node scripts/discover-api-contracts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-delta-${{ github.run_id }}
          path: web/provider-delta.json
